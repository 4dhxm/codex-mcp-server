services:
  - type: web
    name: codex-mcp-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js --http
    envVars:
      - key: PORT
        value: 3000
      - key: CODEX_MCP_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 22
